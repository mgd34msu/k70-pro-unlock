name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python helpers
        run: python3 -m compileall -q scripts tests
      - name: Test refusal, metadata preservation, and readback checks
        run: python3 -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n scripts/bootrom.sh
